services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    depends_on: [qdrant]
    ports: ["8000:8000"]
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      DEMO_SCENARIO: "1"
      # Optional: any OpenAI-compatible endpoint for LLM synthesis
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}

volumes:
  qdrant_data:
