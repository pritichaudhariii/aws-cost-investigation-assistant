name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,qdrant,dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Run evaluation
        run: |
          python -m evaluation.run_eval --out eval-out/results
          python -m evaluation.run_eval --retrieval-mode question --out eval-out/baseline
          cat eval-out/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: eval-out/
